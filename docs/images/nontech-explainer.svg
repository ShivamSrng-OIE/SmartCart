<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#efe9ff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5b21b6" flood-opacity="0.12"/>
    </filter>
    <style>
      .card{fill:#fff}
      .title{font-size:26px;font-weight:800;fill:#1e1b4b;text-anchor:middle}
      .body{font-size:18px;fill:#4b5563;text-anchor:middle}
      .em{font-weight:700;fill:#5b21b6}
      .num{font-size:22px;font-weight:800;fill:#fff;text-anchor:middle}
      .ic{fill:none;stroke:#6d28d9;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .icf{fill:#ede9fe}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- corner waves -->
  <path d="M0 0 H420 C330 60 230 40 150 110 C90 160 40 200 0 210 Z" fill="url(#wave)"/>
  <path d="M0 0 H300 C230 40 160 30 90 80 C50 110 20 130 0 135 Z" fill="#a78bfa" opacity="0.25"/>
  <path d="M1600 900 H1180 C1270 840 1370 860 1450 790 C1510 740 1560 700 1600 690 Z" fill="url(#wave)"/>
  <path d="M1600 900 H1300 C1370 860 1440 870 1510 820 C1550 790 1580 770 1600 765 Z" fill="#a78bfa" opacity="0.25"/>

  <!-- headline -->
  <text x="800" y="128" text-anchor="middle" font-size="62" font-weight="800" fill="#1e1b4b">We stop AI shoppers from getting <tspan fill="#7c3aed">scammed.</tspan></text>
  <line x1="530" y1="182" x2="650" y2="182" stroke="#c4b5fd" stroke-width="2"/>
  <text x="800" y="190" text-anchor="middle" font-size="26" fill="#6b7280">Shop smarter. Shop safer.</text>
  <line x1="950" y1="182" x2="1070" y2="182" stroke="#c4b5fd" stroke-width="2"/>

  <!-- cards: x = 60 + i*300, width 260 -->
  <g filter="url(#sh)">
    <rect class="card" x="60" y="250" width="260" height="440" rx="24"/>
    <rect class="card" x="360" y="250" width="260" height="440" rx="24"/>
    <rect class="card" x="660" y="250" width="260" height="440" rx="24"/>
    <rect class="card" x="960" y="250" width="260" height="440" rx="24"/>
    <rect class="card" x="1260" y="250" width="280" height="440" rx="24"/>
  </g>

  <!-- number badges -->
  <g>
    <circle cx="190" cy="250" r="26" fill="#7c3aed"/><text class="num" x="190" y="258">1</text>
    <circle cx="490" cy="250" r="26" fill="#7c3aed"/><text class="num" x="490" y="258">2</text>
    <circle cx="790" cy="250" r="26" fill="#7c3aed"/><text class="num" x="790" y="258">3</text>
    <circle cx="1090" cy="250" r="26" fill="#7c3aed"/><text class="num" x="1090" y="258">4</text>
    <circle cx="1400" cy="250" r="26" fill="#7c3aed"/><text class="num" x="1400" y="258">5</text>
  </g>

  <!-- chevrons -->
  <g fill="none" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M332 455 l14 15 l-14 15"/><path d="M632 455 l14 15 l-14 15"/>
    <path d="M932 455 l14 15 l-14 15"/><path d="M1232 455 l14 15 l-14 15"/>
  </g>

  <!-- icon 1: chat bubble with $ -->
  <circle class="icf" cx="190" cy="370" r="62"/>
  <path class="ic" d="M150 340 h80 a14 14 0 0 1 14 14 v40 a14 14 0 0 1 -14 14 h-46 l-22 18 v-18 h-12 a14 14 0 0 1 -14 -14 v-40 a14 14 0 0 1 14 -14 z"/>
  <text x="190" y="388" text-anchor="middle" font-size="38" font-weight="800" fill="#6d28d9">$</text>
  <text class="title" x="190" y="490">You ask</text>
  <text class="body" x="190" y="534">Only your request</text>
  <text class="body" x="190" y="560">and budget count</text>
  <text class="body" x="190" y="586">as instructions.</text>

  <!-- icon 2: shopping bag + magnifier -->
  <circle class="icf" cx="490" cy="370" r="62"/>
  <path class="ic" d="M452 352 h56 l6 58 h-68 z"/>
  <path class="ic" d="M466 352 v-8 a14 14 0 0 1 28 0 v8"/>
  <text x="480" y="397" text-anchor="middle" font-size="26" font-weight="900" fill="#16a34a">S</text>
  <circle class="ic" cx="516" cy="396" r="15"/><path class="ic" d="M527 407 l14 14"/>
  <text class="title" x="490" y="490">AI shops for you</text>
  <text class="body" x="490" y="534"><tspan class="em">Gemini 4 Hydrogen</tspan></text>
  <text class="body" x="490" y="560">shops real</text>
  <text class="body" x="490" y="586"><tspan class="em" fill="#16a34a">Shopify</tspan> stores.</text>

  <!-- icon 3: document with warning -->
  <circle class="icf" cx="790" cy="370" r="62"/>
  <path class="ic" d="M762 326 h38 l18 18 v62 h-56 z"/><path class="ic" d="M800 326 v18 h18"/>
  <path class="ic" d="M772 360 h30 M772 374 h22"/>
  <path d="M808 380 l20 34 h-40 z" fill="#fee2e2" stroke="#dc2626" stroke-width="4" stroke-linejoin="round"/>
  <text x="808" y="409" text-anchor="middle" font-size="18" font-weight="900" fill="#dc2626">!</text>
  <text class="title" x="790" y="490">A scam slips in</text>
  <text class="body" x="790" y="534">Hidden in photos,</text>
  <text class="body" x="790" y="560">audio or PDFs.</text>

  <!-- icon 4: shield with check -->
  <circle class="icf" cx="1090" cy="370" r="62"/>
  <path class="ic" d="M1090 322 l40 14 v30 c0 26 -18 44 -40 54 c-22 -10 -40 -28 -40 -54 v-30 z"/>
  <path class="ic" d="M1072 370 l12 12 l24 -26"/>
  <text class="title" x="1090" y="490">We check before</text>
  <text class="title" x="1090" y="522">you pay</text>
  <text class="body" x="1090" y="562"><tspan class="em">Gemini 4 Argon</tspan> reads</text>
  <text class="body" x="1090" y="588">the photo. <tspan class="em">Gemini</tspan></text>
  <text class="body" x="1090" y="614"><tspan class="em">Decisions API</tspan> runs 50</text>
  <text class="body" x="1090" y="640">safety checks in ~1 s.</text>

  <!-- icon 5: green check -->
  <circle cx="1400" cy="370" r="62" fill="#dcfce7"/>
  <circle cx="1400" cy="370" r="40" fill="none" stroke="#16a34a" stroke-width="6"/>
  <path d="M1382 371 l12 12 l24 -26" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="title" x="1400" y="490">You stay safe</text>
  <text class="body" x="1400" y="534">Approve, ask you,</text>
  <text class="body" x="1400" y="560">or block, and show</text>
  <text class="body" x="1400" y="586">where the scam was.</text>

  <!-- footer pill -->
  <rect x="510" y="760" width="580" height="64" rx="32" fill="#fff" stroke="#ddd6fe" filter="url(#sh)"/>
  <path d="M556 776 l18 6 v13 c0 12 -8 20 -18 24 c-10 -4 -18 -12 -18 -24 v-13 z" fill="#ede9fe" stroke="#6d28d9" stroke-width="3" stroke-linejoin="round"/>
  <text x="820" y="800" text-anchor="middle" font-size="22" fill="#374151">Built with <tspan font-weight="800" fill="#5b21b6">Gemini 4</tspan> and the <tspan font-weight="800" fill="#16a34a">Shopify Shop MCP</tspan></text>
</svg>
