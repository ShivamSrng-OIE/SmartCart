<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Shop independent Shopify stores, or let the assistant build your cart." />
    <meta name="theme-color" content="#f1f1f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://cdn.shopify.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.shopify.com" />
    <title>Tote</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tote" />
    <meta property="og:title" content="Tote · Safe Checkout for AI shopping agents" />
    <meta property="og:description" content="Shop real Shopify stores, or let an AI assistant shop for you. Every order is checked before any money moves, and hidden instructions in photos, video, audio or text are caught." />
    <meta property="og:image" content="https://tote-store.pages.dev/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://tote-store.pages.dev/" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        try {
          var saved = localStorage.getItem("carttrap.theme");
          var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
