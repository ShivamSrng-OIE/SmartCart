<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:1.6;rx:10}
      .t{font-size:17px;fill:#0f172a;text-anchor:middle}
      .s{font-size:13px;fill:#475569;text-anchor:middle}
      .lane{font-size:21px;font-weight:700;fill:#0b2a5b}
      .ico{font-size:30px;text-anchor:middle}
      .ln{stroke:#1d4ed8;stroke-width:2.4;fill:none;marker-end:url(#a)}
      .dash{stroke:#1d4ed8;stroke-width:2.2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}
      .red{stroke:#dc2626;stroke-width:2.4;fill:none;marker-end:url(#r)}
      .grn{stroke:#16a34a;stroke-width:2.4;fill:none;marker-end:url(#g)}
      .lbl{font-size:14px;fill:#1d4ed8}
      .lblr{font-size:14px;fill:#dc2626;font-weight:600}
      .lblg{font-size:14px;fill:#16a34a;font-weight:600}
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#ffffff"/>
  <text x="800" y="52" text-anchor="middle" font-size="38" font-weight="800" fill="#0b1f44">CartTrap: Execution Firewall for AI Shopping Agents</text>
  <text x="800" y="88" text-anchor="middle" font-size="24" fill="#475569">System architecture</text>

  <!-- Lane 1: shopper and agent -->
  <rect x="20" y="110" width="1560" height="190" rx="14" fill="#eaf3ff"/>
  <text x="44" y="142" class="lane">Shopper &amp; shopping agent</text>
  <rect class="box" x="44" y="160" width="220" height="120"/><text class="ico" x="154" y="205">🧑‍💻</text>
  <text class="t" x="154" y="237">Shopper request</text><text class="s" x="154" y="258">text + photo / video / audio</text>
  <rect class="box" x="320" y="160" width="230" height="120"/><text class="ico" x="435" y="205">🛍️</text>
  <text class="t" x="435" y="237">Tote storefront</text><text class="s" x="435" y="258">Vite · React 19 · TS</text>
  <rect class="box" x="606" y="160" width="230" height="120"/><text class="ico" x="721" y="205">⚡</text>
  <text class="t" x="721" y="237">FastAPI /api/run</text><text class="s" x="721" y="258">SSE trace stream</text>
  <rect class="box" x="892" y="160" width="250" height="120"/><text class="ico" x="1017" y="205">✦</text>
  <text class="t" x="1017" y="237">Shopping agent</text><text class="s" x="1017" y="258">Gemini 4 Hydrogen</text>
  <rect class="box" x="1198" y="160" width="350" height="120"/><text class="ico" x="1373" y="205">🛒</text>
  <text class="t" x="1373" y="237">Proposed money-moving call</text><text class="s" x="1373" y="258">create_cart / spend request (never sent yet)</text>
  <path class="ln" d="M264 220 H316"/><path class="ln" d="M550 220 H602"/><path class="ln" d="M836 220 H888"/><path class="ln" d="M1142 220 H1194"/>

  <!-- Lane 2: Shopify -->
  <rect x="20" y="320" width="560" height="200" rx="14" fill="#eaf7ee"/>
  <text x="44" y="352" class="lane">Commerce · Shopify Shop MCP</text>
  <rect class="box" x="44" y="370" width="240" height="130"/><text class="ico" x="164" y="415">🟢</text>
  <text class="t" x="164" y="447">search_catalog</text><text class="t" x="164" y="469">get_product</text><text class="s" x="164" y="489">live listing facts</text>
  <rect class="box" x="316" y="370" width="240" height="130"/><text class="ico" x="436" y="415">✅</text>
  <text class="t" x="436" y="447">create_cart</text><text class="s" x="436" y="469">only after approval</text><text class="s" x="436" y="489">complete_* forbidden</text>
  <path class="dash" d="M1017 280 V300 H164 V366"/><text class="lbl" x="560" y="296">agent browses the catalog</text>

  <!-- Lane 3: firewall -->
  <rect x="600" y="320" width="980" height="200" rx="14" fill="#f1f0fb"/>
  <text x="624" y="352" class="lane">CartTrap firewall</text>
  <rect class="box" x="624" y="370" width="250" height="130"/><text class="ico" x="749" y="415">👁️</text>
  <text class="t" x="749" y="447">Argon perception</text><text class="s" x="749" y="469">Gemini 4 Argon · no tools</text><text class="s" x="749" y="489">media → claims (data only)</text>
  <rect class="box" x="914" y="370" width="270" height="130"/><text class="ico" x="1049" y="415">⚖️</text>
  <text class="t" x="1049" y="447">Decisions API · 50 probes</text><text class="s" x="1049" y="469">gemini-decision-1</text><text class="s" x="1049" y="489">claims vs intent vs listing</text>
  <rect class="box" x="1224" y="370" width="330" height="130"/><text class="ico" x="1389" y="415">🛡️</text>
  <text class="t" x="1389" y="447">Gate: approve or hold</text><text class="s" x="1389" y="469">fails closed (2.5 s) · holds listings</text><text class="s" x="1389" y="489">with instructions aimed at agents</text>
  <path class="ln" d="M874 435 H910"/><path class="ln" d="M1184 435 H1220"/>
  <path class="ln" d="M1373 280 V366"/>
  <path class="ln" d="M164 500 V570 H1049 V504"/><text class="lbl" x="620" y="564">real product facts</text>
  <path class="grn" d="M1300 500 V592 H436 V504"/><text class="lblg" x="620" y="586">approve → cart created</text>

  <!-- Lane 4: defense and evidence -->
  <rect x="20" y="620" width="1560" height="190" rx="14" fill="#fff1f2"/>
  <text x="44" y="652" class="lane">Hold path · defense &amp; live evidence</text>
  <rect class="box" x="44" y="670" width="300" height="120"/><text class="ico" x="194" y="712">🧾</text>
  <text class="t" x="194" y="744">Neon defender</text><text class="s" x="194" y="765">Fraud Card · amount protected</text>
  <rect class="box" x="384" y="670" width="300" height="120"/><text class="ico" x="534" y="712">🔁</text>
  <text class="t" x="534" y="744">Safe swap</text><text class="s" x="534" y="765">honest merchant cart · continue_url</text>
  <rect class="box" x="724" y="670" width="400" height="120"/><text class="ico" x="924" y="712">🔍</text>
  <text class="t" x="924" y="744">Evidence localizer (Gemini Argon)</text><text class="s" x="924" y="765">image box + zoom · video frame · audio clip</text>
  <rect class="box" x="1164" y="670" width="390" height="120"/><text class="ico" x="1359" y="712">📺</text>
  <text class="t" x="1359" y="744">"Why was this held?" in the UI</text><text class="s" x="1359" y="765">evidence first · safe Check out button</text>
  <path class="red" d="M1480 500 V610 H194 V666"/><text class="lblr" x="1180" y="604">hold → never sent to Shopify</text>
  <path class="ln" d="M344 730 H380"/><path class="ln" d="M684 730 H720"/><path class="ln" d="M1124 730 H1160"/>

  <!-- Lane 5: self-heal + eval -->
  <rect x="20" y="830" width="1000" height="220" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="862" class="lane">Self-healing rules</text>
  <rect class="box" x="44" y="880" width="220" height="140"/><text class="ico" x="154" y="925">😈</text>
  <text class="t" x="154" y="957">Carbon red-team</text><text class="s" x="154" y="978">Gemini 4 Carbon</text><text class="s" x="154" y="998">mutates on block</text>
  <rect class="box" x="296" y="880" width="220" height="140"/><text class="ico" x="406" y="925">🧠</text>
  <text class="t" x="406" y="957">Propose probe</text><text class="s" x="406" y="978">Gemini 4 Neon</text><text class="s" x="406" y="998">from the bypass trace</text>
  <rect class="box" x="548" y="880" width="220" height="140"/><text class="ico" x="658" y="925">🧪</text>
  <text class="t" x="658" y="957">Validate</text><text class="s" x="658" y="978">fires on exploit,</text><text class="s" x="658" y="998">quiet on benign</text>
  <rect class="box" x="800" y="880" width="200" height="140"/><text class="ico" x="900" y="925">📜</text>
  <text class="t" x="900" y="957">Publish rule</text><text class="s" x="900" y="978">rules.json v+1</text><text class="s" x="900" y="998">.bak · re-block</text>
  <path class="ln" d="M264 950 H292"/><path class="ln" d="M516 950 H544"/><path class="ln" d="M768 950 H796"/>
  <path class="dash" d="M1000 950 H1022 V818 H1144 V530 H1220"/><text class="lbl" x="1152" y="548">new rule → gate</text>

  <rect x="1040" y="830" width="540" height="220" rx="14" fill="#eaf3ff"/>
  <text x="1064" y="862" class="lane">Evaluation &amp; dataset</text>
  <rect class="box" x="1064" y="880" width="240" height="140"/><text class="ico" x="1184" y="925">🎨</text>
  <text class="t" x="1184" y="957">Generated dataset</text><text class="s" x="1184" y="978">nano-banana · 3.8-flash-tts</text><text class="s" x="1184" y="998">one poisoned modality</text>
  <rect class="box" x="1328" y="880" width="228" height="140"/><text class="ico" x="1442" y="925">📊</text>
  <text class="t" x="1442" y="957">run_eval.py</text><text class="s" x="1442" y="978">baseline vs CartTrap</text><text class="s" x="1442" y="998">per modality · Performance</text>
  <path class="ln" d="M1304 950 H1324"/>
</svg>
